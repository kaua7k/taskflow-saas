<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Productivity Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='1.2') }}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">TF</div>
      <span class="logo-name">TaskFlow</span>
    </div>
    
    <nav class="nav-section">
      <div class="nav-label">Visualização</div>
      <div class="nav-item active" data-filter="all"><span>📑</span> Todas <span class="count" id="count-all">0</span></div>
      <div class="nav-item" data-filter="hoje"><span>📅</span> Hoje <span class="count" id="count-hoje">0</span></div>
      <div class="nav-item" data-filter="andamento"><span>⚡</span> Em andamento <span class="count" id="count-andamento">0</span></div>
      <div class="nav-item" data-filter="concluida"><span>✅</span> Concluídas <span class="count" id="count-concluida">0</span></div>
    </nav>

    <div class="nav-section">
      <div class="nav-label">Ferramentas</div>
      <div class="timer-card">
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="timer-start">Iniciar</button>
          <button id="timer-reset">Reset</button>
        </div>
      </div>
    </div>

    <div class="sidebar-bottom">
      <div class="progress-label"><span>Progresso Geral</span><span id="progress-pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Meu Workspace</span>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Buscar tarefas...">
      </div>
      <select class="filter-select" id="priority-filter">
        <option value="all">Todas prioridades</option>
        <option value="alta">Alta</option>
        <option value="media">Média</option>
        <option value="baixa">Baixa</option>
      </select>
      <button class="btn-new" id="btn-new">+ Nova Tarefa</button>
    </header>

    <div class="stats-bar">
      <div class="stat"><div class="stat-label">Total</div><div class="stat-value" id="stat-total">0</div></div>
      <div class="stat"><div class="stat-label">Pendentes</div><div class="stat-value blue" id="stat-andamento">0</div></div>
      <div class="stat"><div class="stat-label">Finalizadas</div><div class="stat-value green" id="stat-concluidas">0</div></div>
      <div class="stat"><div class="stat-label">Alta Prioridade</div><div class="stat-value amber" id="stat-alta">0</div></div>
    </div>

    <div class="content-wrapper">
      <div class="content">
        <div class="task-list" id="task-list"></div>
        <div class="empty hidden" id="empty-state">
          <div class="empty-icon">📂</div>
          <h3>Tudo limpo por aqui!</h3>
          <p>Organize seu dia criando uma nova tarefa.</p>
        </div>
      </div>
      
      <aside class="notes-panel">
        <div class="notes-header">Notas Rápidas</div>
        <textarea id="quick-notes" placeholder="Rascunhos, ideias ou lembretes rápidos..."></textarea>
      </aside>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nova tarefa</span>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Título</label>
      <input type="text" class="form-input" id="task-title" placeholder="O que precisa ser feito?">
    </div>
    <div class="form-group">
      <label class="form-label">Descrição</label>
      <textarea class="form-textarea" id="task-desc" placeholder="Adicione mais detalhes..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Prioridade</label>
        <select class="form-select" id="task-priority">
          <option value="baixa">Baixa</option>
          <option value="media" selected>Média</option>
          <option value="alta">Alta</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Data de Entrega</label>
        <input type="date" class="form-input" id="task-date">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <select class="form-select" id="task-status">
        <option value="pendente">Pendente</option>
        <option value="andamento">Em andamento</option>
        <option value="concluida">Concluída</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-save">Salvar Tarefa</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/app.js', v='1.2') }}"></script>
</body>
</html>
